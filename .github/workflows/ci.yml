name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - run: pip install pydantic requests beautifulsoup4
      - run: PYTHONPATH=backend python3 -c "from src.schemas import DocumentSchema; print('✅ OK')"